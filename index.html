<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💓 ヽ(  ´ᯅ`  )ノ 💓</title>
    <style>
        :root {
            --back-bg: rgba(255, 122, 217, 0.25);   
            --back-border: #4de1ff; 
            --back-text: #4de1ff; 
        }

        * { box-sizing: border-box; }

        body {
            /* 背景画像を外してCSSのネオングラデーションに変更！ */
            background: linear-gradient(135deg, #070720 0%, #1f0a2a 50%, #0a2f38 100%);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: sans-serif;
        }

        img {
            -webkit-user-drag: none;
            user-select: none;
        }

        .title {
            position: fixed;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 0 15px #ff7ad9, 0 0 30px #4de1ff;
            font-weight: bold;
            letter-spacing: 0.2em;
            z-index: 101;
            pointer-events: none;
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 102;
            padding: 10px 26px;
            font-size: 18px;
            font-weight: bold;
            color: var(--back-text);
            text-decoration: none;
            white-space: nowrap;
            background: var(--back-bg);
            border: 2px solid var(--back-border);
            border-radius: 999px;
            box-shadow: 0 0 12px #ff7ad9, inset 0 0 8px #ff7ad9;
            text-shadow: 0 0 8px #4de1ff;
            transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 122, 217, 0.45);
            box-shadow: 0 0 22px #ff7ad9, 0 0 12px #4de1ff;
        }

        .back-btn:active {
            transform: scale(0.94);
        }

        #bg-floaters {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floater {
            position: absolute;
            bottom: -80px;
            height: auto;
            opacity: 0.85;
            filter: drop-shadow(0 0 8px rgba(255, 122, 217, 0.6));
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.85; }
            50%  { transform: translate(var(--sway), -55vh) rotate(180deg); }
            90%  { opacity: 0.85; }
            100% { transform: translate(calc(var(--sway) * -1), -115vh) rotate(360deg); opacity: 0; }
        }

        #eyebrow-btn {
            position: fixed;
            width: 120px;
            height: auto;
            left: calc(50% - 60px);
            top: 40%;
            cursor: pointer;
            z-index: 100;
            filter: drop-shadow(0 0 15px #ff7ad9) drop-shadow(0 0 30px #4de1ff);
            transition: left 0.4s ease, top 0.4s ease;
        }

        #eyebrow-btn.shake {
            animation: tiltShake 0.4s ease-in-out;
        }

        @keyframes tiltShake {
            0%   { transform: rotate(0deg) scale(1); }
            15%  { transform: rotate(-12deg) scale(1.1); }
            30%  { transform: rotate(10deg) scale(1.1); }
            45%  { transform: rotate(-8deg) scale(1.05); }
            60%  { transform: rotate(6deg) scale(1.05); }
            75%  { transform: rotate(-3deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .pop-spawn {
            position: fixed;
            max-width: 40vw;
            max-height: 40vh;
            pointer-events: none;
            z-index: 90;
            filter: drop-shadow(0 0 12px #ff7ad9);
            animation: popBounce 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBounce {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(0, 0) scale(0.2) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.7), calc(var(--ty) * 0.7)) scale(1.15) rotate(calc(var(--rot) * 0.5));
            }
            45% {
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot));
            }
            75% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(var(--tx), calc(var(--ty) + 10px)) scale(1) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--tx), calc(var(--ty) + 30px)) scale(0.8) rotate(calc(var(--rot) + 10deg));
            }
        }
    </style>
</head>
<body>

    <div id="bg-floaters"></div>

    <a class="back-btn" href="https://megakirara.github.io/-KINOKO/game.html">( 👁️ _ 👁️ ) 戻る❓</a>

    <img id="eyebrow-btn" src="mayu/mayu0.png" alt="眉ボタン">

    <script>
        "use strict";

        document.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        document.addEventListener("dragstart", (e) => {
          if (e.target.tagName === "IMG") {
            e.preventDefault();
          }
        });

        const EYEBROW_IMAGES = Array.from({ length: 6 }, (_, i) => `mayu/mayu${i}.png`);

        const SPAWN_IMAGES = Array.from({ length: 21 }, (_, i) => `sm/sm${i + 1}.png`);

        const FLOATER_IMAGES = ['st/y.png', 'st/b.png', 'st/p.png', 'st/m.png', 'st/g.png'];
        const FLOATER_COUNT = 18; 
        const FLOATER_MIN = 30;
        const FLOATER_MAX = 70; 

        const RANDOM_COUNT = 6;

        const MARGIN = 10;
        const TOP_MARGIN = 80;

        function preloadImages(list) {
            list.forEach((src) => {
                const img = new Image();
                img.onerror = () => console.warn('読み込み失敗:', src);
                img.src = src;
            });
        }

        function createFloaters() {
            const box = document.getElementById('bg-floaters');
            for (let i = 0; i < FLOATER_COUNT; i++) {
                const f = document.createElement('img');
                f.className = 'floater';
                f.src = FLOATER_IMAGES[Math.floor(Math.random() * FLOATER_IMAGES.length)];
                f.style.left = Math.random() * 100 + 'vw';
                f.style.width = (FLOATER_MIN + Math.random() * (FLOATER_MAX - FLOATER_MIN)) + 'px';
                f.style.animationDuration = (10 + Math.random() * 14) + 's';
                f.style.animationDelay = (-Math.random() * 20) + 's'; 
                f.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
                f.addEventListener('error', () => f.remove());
                box.appendChild(f);
            }
        }

        class EyebrowColor {
            constructor(count) {
                this.count = count;
                this.lastIndex = 0;
                this.queue = [];
            }

            buildCycle() {
                const max = this.count - 1;
                const seq = [];

                for (let i = 0; i <= max; i++) seq.push(i);
                if (seq[0] === this.lastIndex) seq.shift();

                for (let i = max - 1; i >= 0; i--) seq.push(i);

                let prev = seq[seq.length - 1];
                for (let n = 0; n < RANDOM_COUNT; n++) {
                    let r;
                    do {
                        r = Math.floor(Math.random() * this.count);
                    } while (r === prev);
                    seq.push(r);
                    prev = r;
                }
                return seq;
            }

            next() {
                if (this.queue.length === 0) this.queue = this.buildCycle();
                this.lastIndex = this.queue.shift();
                return this.lastIndex;
            }
        }

        class PopSpawner {
            constructor(images) {
                this.images = images;
                this.currentIndex = 0;
            }

            spawn(fromX, fromY) {
                const img = document.createElement('img');
                img.src = this.images[this.currentIndex];
                img.className = 'pop-spawn';
                img.style.left = `${fromX}px`;
                img.style.top = `${fromY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 150;
                let targetX = fromX + Math.cos(angle) * distance;
                let targetY = fromY + Math.sin(angle) * distance;
                targetX = Math.min(Math.max(targetX, 60), window.innerWidth - 60);
                targetY = Math.min(Math.max(targetY, TOP_MARGIN), window.innerHeight - 60);

                img.style.setProperty('--tx', `${targetX - fromX}px`);
                img.style.setProperty('--ty', `${targetY - fromY}px`);
                img.style.setProperty('--rot', `${(Math.random() - 0.5) * 60}deg`);

                document.body.appendChild(img);

                img.addEventListener('animationend', () => img.remove());
                img.addEventListener('error', () => {
                    console.warn('読み込み失敗:', img.getAttribute('src'));
                    img.remove();
                });

                this.currentIndex = (this.currentIndex + 1) % this.images.length;
            }
        }

        class EyebrowButton {
            constructor(element, images, spawner) {
                this.element = element;
                this.images = images;
                this.spawner = spawner;
                this.color = new EyebrowColor(images.length);

                this.element.src = images[0];
                this.element.addEventListener('click', () => this.handleClick());
            }

            moveTo(left, top) {
                this.element.style.left = `${left}px`;
                this.element.style.top = `${top}px`;
            }

            moveRandom() {
                const w = this.element.offsetWidth;
                const h = this.element.offsetHeight;
                const maxLeft = Math.max(MARGIN, window.innerWidth - w - MARGIN);
                const maxTop = Math.max(TOP_MARGIN, window.innerHeight - h - MARGIN);
                this.moveTo(
                    MARGIN + Math.random() * (maxLeft - MARGIN),
                    TOP_MARGIN + Math.random() * (maxTop - TOP_MARGIN)
                );
            }

            handleClick() {
                this.element.classList.remove('shake');
                void this.element.offsetWidth;
                this.element.classList.add('shake');

                const rect = this.element.getBoundingClientRect();
                this.spawner.spawn(rect.left + rect.width / 2, rect.top + rect.height / 2);

                this.element.src = this.images[this.color.next()];

                this.moveRandom();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            preloadImages(EYEBROW_IMAGES);
            preloadImages(SPAWN_IMAGES);
            preloadImages(FLOATER_IMAGES);

            createFloaters();

            const spawner = new PopSpawner(SPAWN_IMAGES);
            new EyebrowButton(document.getElementById('eyebrow-btn'), EYEBROW_IMAGES, spawner);
        });
    </script>
</body>
</html>
